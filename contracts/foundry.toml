[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

# Use Foundry >=1.8 with Monad execution enabled, per the current official guide.
# Verify the exact Foundry network flags before deployment; this config alone is not a Monad emulator.
